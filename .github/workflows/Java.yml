name: Java JDBC

# 仅手动触发，避免每次 push/PR 都消耗 Actions 额度
on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test runs'
        required: false
        default: 'false'
        type: 'string'

jobs:

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 -m pip install --user clang_format==11.0.1
          make format-check

  java-linux-amd64:
    name: Linux (amd64)
    runs-on: ubuntu-latest
    needs: format-check
    env:
      MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Key
        id: cache_key
        run: |
          DUCKDB_VERSION=$(python ./scripts/print_duckdb_version.py)
          KEY="${{ runner.os }}-${{ runner.arch }}-$DUCKDB_VERSION"
          echo "value=${KEY}" >> "${GITHUB_OUTPUT}"

      - name: Restore Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ${{ steps.cache_key.outputs.value }}

      - name: Enforce jemalloc
        working-directory: src/duckdb
        run: |
          patch -p1 < ${{ github.workspace }}/data/vendoring/jemalloc_enforce.patch
          git diff HEAD

      - name: Build
        uses: ./.github/composite-actions/linux-build-docker
        with:
          docker_image: '${{ env.MANYLINUX_IMAGE }}'

      - name: Save Cache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ${{ steps.cache_key.outputs.value }}

      - name: List Symbols
        run: |
          nm -gU ./build/release/libduckdb_java.so_linux_amd64

      - name: Check Module Name
        run: |
          java \
            --module-path ./build/release/duckdb_jdbc.jar \
            -d duckdb.jdbc

      - name: JDBC Tests EL8
        if: ${{ inputs.skip_tests != 'true' }}
        uses: ./.github/composite-actions/linux-tests-docker
        with:
          docker_image: '${{ env.MANYLINUX_IMAGE }}'

      - name: JDBC Tests
        if: ${{ inputs.skip_tests != 'true' }}
        uses: ./.github/composite-actions/linux-tests-host

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist/jdbc
          cp build/release/libduckdb_java.so_linux_amd64 dist/jdbc/
          cp build/release/duckdb_jdbc.jar               dist/jdbc/ || true
          cp build/release/duckdb_jdbc_tests.jar         dist/jdbc/ || true
          echo "===== dist/jdbc 产物 ====="
          ls -lh dist/jdbc/

      - uses: actions/upload-artifact@v4
        with:
          name: java-linux-amd64
          path: dist/jdbc/*
          if-no-files-found: error
          retention-days: 14

  java-windows-amd64:
    name: Windows (amd64)
    runs-on: windows-latest
    needs: format-check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure & Build
        shell: cmd
        run: |
          mkdir build\release
          cd build\release
          cmake ..\..\ -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Verify artifacts
        shell: cmd
        run: |
          echo ===== build\release 产物 =====
          dir build\release
          echo ===== DLL 架构信息 =====
          dumpbin.exe /headers build\release\libduckdb_java.so_windows_amd64 | findstr /C:"machine"

      - name: Java Tests
        if: ${{ inputs.skip_tests != 'true' }}
        shell: bash
        run: |
          java -version
          make test

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist/jdbc
          cp build/release/libduckdb_java.so_windows_amd64 dist/jdbc/
          cp build/release/duckdb_jdbc.jar               dist/jdbc/ || true
          cp build/release/duckdb_jdbc_tests.jar         dist/jdbc/ || true
          echo "===== dist/jdbc 产物 ====="
          ls -lh dist/jdbc/

      - uses: actions/upload-artifact@v4
        with:
          name: java-windows-amd64
          path: dist/jdbc/*
          if-no-files-found: error
          retention-days: 14

  java-osx-universal:
    name: macOS (Universal)
    runs-on: macos-latest
    needs: format-check
    env:
      GEN: ninja
      CC: 'ccache clang'
      CXX: 'ccache clang++'
      CCACHE_DIR: ${{ github.workspace }}/ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache Key
        id: cache_key
        run: |
          DUCKDB_VERSION=$(python3 ./scripts/print_duckdb_version.py)
          KEY="${{ runner.os }}-${{ runner.arch }}-$DUCKDB_VERSION"
          echo "value=${KEY}" >> "${GITHUB_OUTPUT}"

      - name: Restore Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ${{ steps.cache_key.outputs.value }}

      - name: Install Dependencies
        run: |
          brew install -q \
            ccache \
            ninja

      - name: Build
        shell: bash
        run: make release

      - name: Save Cache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ${{ steps.cache_key.outputs.value }}

      - name: List Symbols
        run: |
          nm -gU ./build/release/libduckdb_java.so_osx_universal

      - name: Verify universal binary
        shell: bash
        run: lipo -archs build/release/libduckdb_java.so_osx_universal | grep "x86_64 arm64"

      - name: Java Tests
        if: ${{ inputs.skip_tests != 'true' }}
        shell: bash
        run: make test

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist/jdbc
          cp build/release/libduckdb_java.so_osx_universal dist/jdbc/
          cp build/release/duckdb_jdbc.jar                 dist/jdbc/ || true
          cp build/release/duckdb_jdbc_tests.jar           dist/jdbc/ || true
          echo "===== dist/jdbc 产物 ====="
          ls -lh dist/jdbc/

      - uses: actions/upload-artifact@v4
        with:
          name: java-osx-universal
          path: dist/jdbc/*
          if-no-files-found: error
          retention-days: 14